name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'sidestore-source.json'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ios-unsigned:
    name: Build unsigned iPhone IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare SideStore build metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.buildNumber = process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "SparFlow $VERSION ($BUILD_NUMBER)"

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set +e
          npm install --no-audit --no-fund 2>&1 | tee ci-logs/install.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Typecheck
        id: typecheck
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set +e
          npm run typecheck 2>&1 | tee ci-logs/typecheck.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Generate native iOS project
        id: prebuild
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          set +e
          npx expo prebuild --platform ios --clean --no-install 2>&1 | tee ci-logs/prebuild.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install CocoaPods
        id: pods
        if: always() && steps.prebuild.outcome == 'success'
        continue-on-error: true
        working-directory: ios
        run: |
          set +e
          pod install --repo-update 2>&1 | tee ../ci-logs/pods.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build unsigned device app
        id: xcode
        if: always() && steps.pods.outcome == 'success'
        continue-on-error: true
        working-directory: ios
        run: |
          set +e
          xcodebuild \
            -workspace SparFlow.xcworkspace \
            -scheme SparFlow \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../ci-logs/xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Package IPA
        id: package
        if: always() && steps.xcode.outcome == 'success'
        continue-on-error: true
        working-directory: ios
        run: |
          set +e
          {
            APP_PATH="build/Build/Products/Release-iphoneos/SparFlow.app"
            test -d "$APP_PATH" || exit 20
            rm -rf Payload SparFlow.ipa
            mkdir Payload
            cp -R "$APP_PATH" Payload/SparFlow.app
            zip -qry SparFlow.ipa Payload
            mv SparFlow.ipa ../SparFlow.ipa
          } 2>&1 | tee ../ci-logs/package.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload IPA artifact
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: SparFlow-SideStore-IPA
          path: SparFlow.ipa
          if-no-files-found: error

      - name: Publish stable tagged build
        if: steps.package.outcome == 'success' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp assets/icon.png SparFlow-icon.png
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "SparFlow $TAG" --notes "Unsigned iPhone IPA for SideStore sideloading."
          gh release upload "$TAG" SparFlow.ipa SparFlow-icon.png --clobber

      - name: Publish automatic SideStore update
        if: steps.package.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          AUTO_TAG="sidestore-latest"
          cp assets/icon.png SparFlow-icon.png
          gh release view "$AUTO_TAG" >/dev/null 2>&1 || \
            gh release create "$AUTO_TAG" --title "SparFlow SideStore Auto Update" --notes "Latest automatic SideStore build."
          gh release upload "$AUTO_TAG" SparFlow.ipa SparFlow-icon.png --clobber

          export IPA_SIZE=$(stat -f%z SparFlow.ipa)
          export RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${AUTO_TAG}/SparFlow.ipa"

          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('sidestore-source.json', 'utf8'));
          const app = source.apps[0];
          const next = {
            version: process.env.VERSION,
            buildVersion: process.env.BUILD_NUMBER,
            date: process.env.RELEASE_DATE,
            localizedDescription: 'Automatischer SparFlow-Build aus dem aktuellen main-Stand.',
            downloadURL: process.env.DOWNLOAD_URL,
            size: Number(process.env.IPA_SIZE),
            minOSVersion: '16.4'
          };
          app.versions = [next, ...(app.versions || []).filter(v => v.buildVersion !== next.buildVersion)].slice(0, 12);
          fs.writeFileSync('sidestore-source.json', JSON.stringify(source, null, 2) + '\n');
          NODE

          SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/sidestore-source.json?ref=main" --jq .sha)
          SOURCE_B64=$(base64 < sidestore-source.json | tr -d '\n')
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/sidestore-source.json" \
            -f message="chore: publish SideStore build ${VERSION} (${BUILD_NUMBER}) [skip ci]" \
            -f content="$SOURCE_B64" \
            -f sha="$SOURCE_SHA" \
            -f branch="main" >/dev/null

      - name: Publish diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "SparFlow iOS CI diagnostic"
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "version: ${{ steps.metadata.outputs.version }}"
            echo "build: ${{ steps.metadata.outputs.build_number }}"
            echo
            echo "install:   ${{ steps.install.outcome }} (exit ${{ steps.install.outputs.exit_code }})"
            echo "typecheck: ${{ steps.typecheck.outcome }} (exit ${{ steps.typecheck.outputs.exit_code }})"
            echo "prebuild:  ${{ steps.prebuild.outcome }} (exit ${{ steps.prebuild.outputs.exit_code }})"
            echo "pods:      ${{ steps.pods.outcome }} (exit ${{ steps.pods.outputs.exit_code }})"
            echo "xcode:     ${{ steps.xcode.outcome }} (exit ${{ steps.xcode.outputs.exit_code }})"
            echo "package:   ${{ steps.package.outcome }} (exit ${{ steps.package.outputs.exit_code }})"
            echo
            echo "===== NATIVE VERSION GRAPH ====="
            npm ls react-native-reanimated react-native-worklets --all || true
            echo
            if [ -f ci-logs/xcodebuild.log ]; then
              echo "===== XCODE ERROR SUMMARY ====="
              grep -n -C 8 -E '(^|[[:space:]])(fatal )?error:|BUILD FAILED|The following build commands failed|ExpoWorkletsBridgeProvider' ci-logs/xcodebuild.log | tail -n 240 || true
              echo
            fi
            for file in ci-logs/install.log ci-logs/typecheck.log ci-logs/prebuild.log ci-logs/pods.log ci-logs/xcodebuild.log ci-logs/package.log; do
              if [ -f "$file" ]; then
                echo "===== $file (last 160 lines) ====="
                tail -n 160 "$file"
                echo
              fi
            done
          } > ci-report.txt

          encoded=$(base64 < ci-report.txt | tr -d '\n')
          report_path="ci-reports/run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}.txt"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${report_path}" \
            -f message="ci: add diagnostic report for run ${GITHUB_RUN_NUMBER} [skip ci]" \
            -f content="$encoded" \
            -f branch="ci-diagnostics" >/dev/null

      - name: Enforce clean build
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.prebuild.outcome }}" = "success"
          test "${{ steps.pods.outcome }}" = "success"
          test "${{ steps.xcode.outcome }}" = "success"
          test "${{ steps.package.outcome }}" = "success"
