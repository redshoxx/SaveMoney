name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'sidestore-source.json'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sidestore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    name: Build unsigned iPhone IPA
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Prepare SideStore build metadata
        id: metadata
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.buildNumber = process.env.GITHUB_RUN_NUMBER;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "SparPilot $VERSION ($BUILD_NUMBER)"

      - name: Install dependencies
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            echo "npm install attempt ${attempt}/3"
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "npm install failed after 3 attempts"
          exit 1

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Expo project diagnostics
        run: npx --yes expo-doctor@1.20.2

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned device app
        working-directory: ios
        shell: bash
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace $WORKSPACE with scheme $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        shell: bash
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          rm -rf Payload SparFlow.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/SparPilot.app
          zip -qry SparFlow.ipa Payload
          mv SparFlow.ipa ../SparFlow.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: SparPilot-SideStore-IPA
          path: SparFlow.ipa
          if-no-files-found: error

      - name: Publish automatic SideStore update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          CURRENT_VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/contents/app.json?ref=main" --jq .content | base64 --decode | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).expo.version))")
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Skipping stale release $VERSION; main is already $CURRENT_VERSION"
            exit 0
          fi

          AUTO_TAG="sidestore-latest"
          cp assets/icon.png SparFlow-icon.png
          gh release view "$AUTO_TAG" >/dev/null 2>&1 || \
            gh release create "$AUTO_TAG" --title "SparPilot SideStore Auto Update" --notes "Latest automatic SideStore build."
          gh release edit "$AUTO_TAG" --title "SparPilot SideStore Auto Update" --notes "Latest automatic SideStore build of SparPilot."
          gh release upload "$AUTO_TAG" SparFlow.ipa SparFlow-icon.png --clobber

          export IPA_SIZE=$(stat -f%z SparFlow.ipa)
          export RELEASE_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${AUTO_TAG}/SparFlow.ipa"

          gh api "repos/${GITHUB_REPOSITORY}/contents/sidestore-source.json?ref=main" --jq .content | base64 --decode > sidestore-source.live.json

          node - <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('sidestore-source.live.json', 'utf8'));
          source.name = 'SparPilot';
          const app = source.apps[0];
          app.name = 'SparPilot';
          app.localizedDescription = 'Lokale Spar-App mit klaren Zielen, Aufgaben, Challenges und Erinnerungen. Einfach sparen, ohne Account und ohne Cloud-Zwang.';
          const next = {
            version: process.env.VERSION,
            date: process.env.RELEASE_DATE,
            localizedDescription: `SparPilot ${process.env.VERSION} mit neuem Sparschwein-Icon, klarer geführter Oberfläche, To-Dos sowie Erinnerungen für Sparziele und Challenges.`,
            downloadURL: process.env.DOWNLOAD_URL,
            size: Number(process.env.IPA_SIZE),
            minOSVersion: '16.4'
          };

          const seen = new Set([next.version]);
          const previous = (app.versions || [])
            .map(({ buildVersion, ...entry }) => entry)
            .filter((entry) => {
              if (!entry.version || seen.has(entry.version)) return false;
              seen.add(entry.version);
              return true;
            });

          app.versions = [next, ...previous].slice(0, 12);
          app.version = next.version;
          app.versionDate = next.date;
          app.versionDescription = next.localizedDescription;
          app.downloadURL = next.downloadURL;
          app.size = next.size;

          fs.writeFileSync('sidestore-source.json', JSON.stringify(source, null, 2) + '\n');
          NODE

          CURRENT_VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/contents/app.json?ref=main" --jq .content | base64 --decode | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).expo.version))")
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            echo "Main changed to $CURRENT_VERSION during publish; source update skipped."
            exit 0
          fi

          SOURCE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/sidestore-source.json?ref=main" --jq .sha)
          SOURCE_B64=$(base64 < sidestore-source.json | tr -d '\n')
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/sidestore-source.json" \
            -f message="chore: publish SideStore ${VERSION} (${BUILD_NUMBER}) [skip ci]" \
            -f content="$SOURCE_B64" \
            -f sha="$SOURCE_SHA" \
            -f branch="main" >/dev/null

      - name: Publish stable tagged build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp assets/icon.png SparFlow-icon.png
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "SparPilot $TAG" --notes "Unsigned iPhone IPA for SideStore sideloading."
          gh release upload "$TAG" SparFlow.ipa SparFlow-icon.png --clobber
